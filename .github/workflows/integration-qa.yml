name: AstraForge integration QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astraforge-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack disable || true
          npm install --global pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production configuration presence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORGE_VAULT_KEY: ${{ secrets.FORGE_VAULT_KEY }}
          ASTRA_ACCESS_TOKEN: ${{ secrets.ASTRA_ACCESS_TOKEN }}
          ASTRA_SESSION_SECRET: ${{ secrets.ASTRA_SESSION_SECRET }}
          ASTRA_WORKER_NAME: ${{ vars.ASTRA_WORKER_NAME }}
          ASTRA_API_ORIGIN: ${{ vars.ASTRA_API_ORIGIN }}
          ASTRA_FRONTEND_ORIGIN: ${{ vars.ASTRA_FRONTEND_ORIGIN }}
          ASTRA_OWNER_ID: ${{ vars.ASTRA_OWNER_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          for name in \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FORGE_VAULT_KEY \
            ASTRA_ACCESS_TOKEN ASTRA_SESSION_SECRET ASTRA_WORKER_NAME \
            ASTRA_API_ORIGIN ASTRA_FRONTEND_ORIGIN ASTRA_OWNER_ID \
            CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_D1_DATABASE_NAME
          do
            if [ -n "${!name:-}" ]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=missing\n' "$name"
            fi
          done

      - name: TypeScript
        id: typescript
        continue-on-error: true
        run: pnpm exec tsc --noEmit

      - name: Repository lint debt visibility
        id: repository_lint
        continue-on-error: true
        run: pnpm lint

      - name: Deployment lint gate
        id: deployment_lint
        continue-on-error: true
        run: >
          pnpm exec eslint
          app/api/auth/route.ts
          app/page.tsx
          components/forge/access-gate.tsx
          lib/server.ts
          lib/session-auth.ts
          next.config.ts
          scripts/prepare-cloudflare-deploy.mjs

      - name: Core protocol tests
        id: core_tests
        continue-on-error: true
        run: node --experimental-strip-types --test tests/core.test.ts

      - name: Database invariants
        id: database_tests
        continue-on-error: true
        run: python3 tests/database_test.py

      - name: Production build
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Validate generated Cloudflare deployment
        id: worker_dry_run
        continue-on-error: true
        env:
          ASTRA_WORKER_NAME: astraforge-ci
          ASTRA_API_ORIGIN: https://api.example.com
          ASTRA_FRONTEND_ORIGIN: https://app.example.com
          ASTRA_OWNER_ID: ci-owner
          CLOUDFLARE_D1_DATABASE_ID: 00000000-0000-4000-8000-000000000001
          CLOUDFLARE_D1_DATABASE_NAME: astraforge-ci
        run: |
          node scripts/prepare-cloudflare-deploy.mjs
          cat > "$RUNNER_TEMP/astra-ci-secrets.json" <<'JSON'
          {
            "FORGE_VAULT_KEY": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
            "ASTRA_ACCESS_TOKEN": "ci-access-token",
            "ASTRA_SESSION_SECRET": "ci-session-secret"
          }
          JSON
          pnpm exec wrangler deploy \
            --dry-run \
            --config dist/server/wrangler.production.json \
            --secrets-file "$RUNNER_TEMP/astra-ci-secrets.json" \
            --outdir "$RUNNER_TEMP/astra-worker-dry-run"

      - name: Enforce verification gate
        if: always()
        env:
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          REPOSITORY_LINT: ${{ steps.repository_lint.outcome }}
          DEPLOYMENT_LINT: ${{ steps.deployment_lint.outcome }}
          CORE_TESTS: ${{ steps.core_tests.outcome }}
          DATABASE_TESTS: ${{ steps.database_tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          WORKER_DRY_RUN: ${{ steps.worker_dry_run.outcome }}
        run: |
          printf 'TypeScript: %s\nRepository lint (legacy debt visibility): %s\nDeployment lint: %s\nCore tests: %s\nDatabase tests: %s\nBuild: %s\nWorker dry run: %s\n' \
            "$TYPESCRIPT" "$REPOSITORY_LINT" "$DEPLOYMENT_LINT" "$CORE_TESTS" "$DATABASE_TESTS" "$BUILD" "$WORKER_DRY_RUN"
          test "$TYPESCRIPT" = success
          test "$DEPLOYMENT_LINT" = success
          test "$CORE_TESTS" = success
          test "$DATABASE_TESTS" = success
          test "$BUILD" = success
          test "$WORKER_DRY_RUN" = success
